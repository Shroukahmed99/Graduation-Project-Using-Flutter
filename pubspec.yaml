name: sehatak
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  bloc: ^9.0.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.8.0+1
  dots_indicator: ^3.0.0
  google_generative_ai: ^0.2.1
  dropdown_button2: ^2.3.9
  file_picker: ^8.0.0
  flutter:
    sdk: flutter
  flutter_animate: ^3.0.0
  flutter_bloc: 9.0.0
  flutter_ruler_picker: ^1.0.6
  flutter_screenutil: ^5.9.3
  flutter_stripe: ^11.5.0
  flutter_svg: ^2.0.0
  font_awesome_flutter: ^10.4.0
  go_router: ^14.8.0
  http_parser: ^4.0.2
  image_picker: ^1.0.4
  intl: ^0.20.2
  mime: ^1.0.4
  path_provider: ^2.1.1
  shared_preferences: ^2.5.2
  simple_ruler_picker: ^0.1.1
  socket_io_client: ^3.1.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.0.0
  jwt_decoder: ^2.0.1
  

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/nn.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icon/
    - assets/images/chatpot icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/Fonts/Poppins-Italic.ttf
          style: italic
    - family: LeagueSpartan
      fonts:
        - asset: assets/Fonts/LeagueSpartan-Thin.ttf
